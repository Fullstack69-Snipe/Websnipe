# backend/docker-compose.yml — รันเฉพาะ backend ตอนพัฒนา
#
# ต้องมี network preflight_pf-net อยู่ก่อน (สร้างโดย db/docker-compose.yml)
#   cd ../db && docker compose up -d
#
# ถ้าจะรันทั้งระบบ ใช้ docker-compose.yml ที่ root แทนไฟล์นี้
name: preflight

services:
  backend:
    container_name: pf-backend
    # context เป็น root ของ repo เพราะ backend ใช้แพ็กเกจ db แบบ file:../db
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - UPLOAD_DIR=/data/uploads
      - POSTGRES_HOST=pf-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
      - RUN_SEED=true
    volumes:
      - pf-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - preflight_pf-net
    restart: unless-stopped

networks:
  preflight_pf-net:
    external: true

volumes:
  pf-uploads:
